parameters:
  - name: target
    type: string

steps:
  - task: UsePythonVersion@0
    inputs: { versionSpec: "3.11" }
  - script: |
      curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      pip install build
    displayName: Install Databricks CLI
  - script: |
      databricks bundle validate -t ${{ parameters.target }}
      databricks bundle deploy -t ${{ parameters.target }}
    displayName: Deploy bundle (${{ parameters.target }})
    env:
      DATABRICKS_HOST: $(DATABRICKS_HOST)
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
  - ${{ if eq(parameters.target, 'dev') }}:
      - script: databricks bundle run rx_lakehouse_daily -t dev
        displayName: Smoke run on dev
        env:
          DATABRICKS_HOST: $(DATABRICKS_HOST)
          ARM_CLIENT_ID: $(ARM_CLIENT_ID)
          ARM_TENANT_ID: $(ARM_TENANT_ID)
          ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
