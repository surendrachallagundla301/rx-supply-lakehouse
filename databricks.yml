# Databricks Asset Bundle: deploys the wheel and the job to dev and prod workspaces.
#   databricks bundle validate -t dev
#   databricks bundle deploy  -t dev
#   databricks bundle run rx_lakehouse_daily -t dev
bundle:
  name: rx-supply-lakehouse

include:
  - resources/*.yml

artifacts:
  rx_lakehouse_wheel:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog for this environment
  raw_path:
    description: Landing zone for raw files (ADLS Gen2 volume)
  node_type:
    default: Standard_D4ds_v5
  schedule_status:
    default: PAUSED

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-0000000000000000.0.azuredatabricks.net   # replace with your workspace URL
    variables:
      catalog: rx_dev
      raw_path: /Volumes/rx_dev/supply/raw

  prod:
    mode: production
    workspace:
      host: https://adb-0000000000000000.0.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: rx_prod
      raw_path: /Volumes/rx_prod/supply/raw
      schedule_status: UNPAUSED
