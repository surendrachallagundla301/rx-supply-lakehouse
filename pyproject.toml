[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rx-lakehouse"
version = "0.1.0"
description = "Pharmaceutical distribution lakehouse on Databricks: PySpark medallion pipeline, star schema, KPI API"
requires-python = ">=3.10"
dependencies = []  # pyspark is provided by the Databricks runtime

[project.optional-dependencies]
local = ["pyspark>=3.5", "pandas>=2.0", "numpy>=1.26"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "duckdb>=1.0", "sqlglot>=25", "openai>=1.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
rx-pipeline = "rx_lakehouse.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends()/Query() defaults are the intended pattern
